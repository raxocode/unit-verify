name: Feature Proposal
description: Suggest an idea or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Note that this repository is an offline-first library/CLI tool. Features requiring hosted services, network calls, or web frontends are strictly out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What behavior or interface are you proposing?
    validations:
      required: true
